services:
  llm-mcp:
    image: ghcr.io/thomasquintana/llm-mcp:0.1.0
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY for classify}
      LLM_MCP_GENERATE_AUTH: oauth
      LLM_MCP_ALLOWED_HOSTS: localhost,127.0.0.1,llm-mcp
    volumes:
      - oauth-state:/state
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 135s
volumes:
  oauth-state: {}

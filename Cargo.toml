[package]
name = "llm-mcp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/thomasquintana/llm-mcp"
description = "Stateless OpenAI generation and decisions tools over MCP"
readme = "README.md"
keywords = ["mcp", "openai", "llm", "classification"]
categories = ["command-line-utilities", "web-programming"]
exclude = [".opencode/", "deploy/", ".github/"]

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"

[package.metadata.docs.rs]
all-features = true

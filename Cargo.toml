[package]
name = "llm-mcp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/thomasquintana/llm-mcp"
description = "Stateless OpenAI generation and decisions tools over MCP"
readme = "README.md"
keywords = ["mcp", "openai", "llm", "classification"]
categories = ["command-line-utilities", "web-programming"]
exclude = [".opencode/", "deploy/", ".github/"]

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "form"] }
rmcp = { version = "3.7", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"

[package.metadata.docs.rs]
all-features = true

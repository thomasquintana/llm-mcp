[package]
name = "llm-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/thomasquintana/llm-mcp"
description = "Stateless OpenAI generation and decisions tools over MCP"
readme = "README.md"
keywords = ["mcp", "openai", "llm", "classification"]
categories = ["command-line-utilities", "web-programming"]
exclude = [".opencode/", "deploy/", ".github/"]

[dependencies]
axum = "0.8"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "form"] }
rmcp = { version = "3.7", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
aws-lc-rs = "1.18"
h2 = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["http2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"

[package.metadata.docs.rs]
all-features = true
